# ====================================================================
# INNOICA WhatsApp Agents v2.0 — Nginx Configuration Alternative
# ====================================================================

upstream web_upstream {
  server web:3000;
}

upstream whatsapp_worker_upstream {
  server whatsapp-worker:4001;
}

upstream ai_runtime_upstream {
  server ai-runtime:4002;
}

upstream ingestion_worker_upstream {
  server ingestion-worker:4003;
}

server {
  listen 80;
  server_name agents.innoica.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name agents.innoica.com;

  ssl_certificate /etc/letsencrypt/live/agents.innoica.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/agents.innoica.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  # Security headers
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 25M;

  # WhatsApp Worker pairing and session routes
  location /api/sessions/ {
    proxy_pass http://whatsapp_worker_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # AI Runtime generation routes
  location /api/generate-response {
    proxy_pass http://ai_runtime_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Knowledge Ingestion routes
  location /api/ingest/ {
    proxy_pass http://ingestion_worker_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Next.js Web SaaS Application
  location / {
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
